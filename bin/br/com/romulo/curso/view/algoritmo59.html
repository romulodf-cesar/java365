<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 3 - JavaScript</title>
</head>
<body>

   <script>
       //variável - const,let, var (absoleta)
       const a = "20"
       console.log("a:"+a)
       const b = a * 2 //ok
       console.log("b:"+b)
       const c = a / 2 //ok
       console.log("c:"+c)
       const d = a - 2 //ok
       console.log("d:"+d)
       const e = a + 2 // não  "+" - concatenação
       alert("e:"+e)
       console.log("e:"+e)
       const f = Number(a) + 2
       alert("f:"+f)
       console.log("f:"+f)
       alert("a: "+typeof a)
       alert("b: "+typeof b)
       alert("c: "+typeof c)
       alert("d: "+typeof d)
       alert("e: "+typeof e)
       alert("f: "+typeof f)
   </script>

    
</body>
</html>
